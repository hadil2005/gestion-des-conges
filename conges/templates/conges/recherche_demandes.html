<!DOCTYPE html>
<html>
<head>
    <title>Recherche de Demandes</title>
</head>
<body>

<h2>Recherche de Demandes</h2>

<form method="get">
    <input type="text" name="nom" placeholder="Nom employé" value="{{ nom }}">

    <select name="departement">
        <option value="">Tous les départements</option>
        {% for dep in departements %}
        <option value="{{ dep.id }}" {% if departement == dep.id|stringformat:"s" %}selected{% endif %}>{{ dep.nom_de_departement }}</option>
        {% endfor %}
    </select>

    <select name="direction">
        <option value="">Toutes les directions</option>
        {% for dir in directions %}
        <option value="{{ dir.id }}" {% if direction == dir.id|stringformat:"s" %}selected{% endif %}>{{ dir.nom_de_direction }}</option>
        {% endfor %}
    </select>

    <input type="date" name="date_debut" value="{{ date_debut }}">
    <input type="date" name="date_fin" value="{{ date_fin }}">

    <select name="statut">
        <option value="">Tous les statuts</option>
        {% for code, label in statut_choices %}
        <option value="{{ code }}" {% if statut == code %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
    </select>

    <select name="type_conge">
        <option value="">Tous les types</option>
        <option value="1" {% if type_conge == '1' %}selected{% endif %}>Congé xxx</option>
        <option value="2" {% if type_conge == '2' %}selected{% endif %}>Congé maladie</option>
        <option value="3" {% if type_conge == '3' %}selected{% endif %}>Congé xx</option>
        <option value="AU" {% if type_conge == 'AU' %}selected{% endif %}>Autre</option>
    </select>

    <button type="submit">Rechercher</button>
</form>

<table>
    <tr>
        <th>Employé</th>
        <th>Statut</th>
        <th>Niveau</th>
        <th>Type</th>
        <th>Date</th>
    </tr>
    {% for demande in demandes %}
    <tr>
        <td>{{ demande.name_employee }}</td>
        <td>{{ demande.get_statue_display }}</td>
        <td>{{ demande.niveau_validation }}</td>
        <td>{{ demande.get_type_conge_display }}</td>
        <td>{{ demande.dateCreation }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="5">Aucune demande trouvée.</td></tr>
    {% endfor %}
</table>

</body>
</html>
