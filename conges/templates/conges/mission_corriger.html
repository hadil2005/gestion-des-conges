<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Corriger mission</title>
</head>
<body>
    <h1>Corriger mission</h1>
    <p><strong>Employé :</strong> {{ mission.employe.nom }} {{ mission.employe.prenom }}</p>
    <p><strong>Période :</strong> {{ mission.dateDebut }} → {{ mission.dateFin }}</p>
    <p><strong>Motif :</strong> {{ mission.motif|default:"—" }}</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" name="save">Enregistrer</button>
        <button type="submit" name="decline">Annuler</button>
    </form>
</body>
</html>
